services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lunatic_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - lunatic_net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lunatic_php
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-lunatic_lab}
      DB_USER: ${DB_USER:-lunatic}
      DB_PASS: ${DB_PASS:-lunatic_secret}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lunatic_net

  mysql:
    image: mariadb:11.4
    container_name: lunatic_mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-lunatic_lab}
      MARIADB_USER: ${DB_USER:-lunatic}
      MARIADB_PASSWORD: ${DB_PASS:-lunatic_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
    ports:
      - "3307:3306"
    volumes:
      - lunatic_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lunatic_net

networks:
  lunatic_net:
    driver: bridge

volumes:
  lunatic_db:
